<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlayerLab — 决策复盘与校准</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --panel2:#1c2430; --border:#2d3748;
          --text:#d7dde6; --muted:#8b98a9; --accent:#4da3ff; --ok:#3fb950;
          --warn:#d29922; --bad:#f85149; --mono:ui-monospace,Consolas,monospace; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.55 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { display:flex; align-items:baseline; gap:18px; padding:12px 22px;
           border-bottom:1px solid var(--border); background:var(--panel); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  header span { color:var(--muted); font-size:12px; }
  nav { display:flex; gap:6px; flex-wrap:wrap; }
  nav button { background:transparent; color:var(--muted); border:1px solid transparent;
               border-radius:6px; padding:5px 12px; cursor:pointer; font-size:13px; }
  nav button.on { color:var(--text); border-color:var(--border); background:var(--panel2); }
  #lang-btn { margin-left:auto; background:transparent; color:var(--muted);
              border:1px solid var(--border); border-radius:6px; padding:4px 10px;
              cursor:pointer; font-size:12px; }
  #lang-btn:hover { color:var(--text); border-color:var(--accent); }
  #app { padding:18px 22px; max-width:1150px; margin:0 auto; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:8px;
          padding:14px 16px; margin-bottom:14px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  h2 { font-size:15px; margin:2px 0 10px; }
  h3 { font-size:12px; margin:12px 0 6px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px;}
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  tr.click { cursor:pointer; } tr.click:hover td { background:var(--panel2); }
  .btn { background:var(--panel2); color:var(--text); border:1px solid var(--border);
         border-radius:6px; padding:5px 10px; cursor:pointer; font-size:12px; }
  .btn:hover { border-color:var(--accent); }
  .chip { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px;
          border:1px solid var(--border); }
  .chip.HIGH,.chip.ok{color:var(--ok);border-color:var(--ok)}
  .chip.MEDIUM,.chip.warn{color:var(--warn);border-color:var(--warn)}
  .chip.LOW,.chip.bad{color:var(--bad);border-color:var(--bad)}
  .mono { font-family:var(--mono); font-size:12px; }
  .muted { color:var(--muted); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .stat b { font-size:22px; } .stat small { color:var(--muted); }
  .bar { height:8px; background:var(--panel2); border-radius:4px; overflow:hidden; margin-top:4px; }
  .bar > i { display:block; height:100%; background:var(--accent); }
  .cue { border-left:3px solid var(--accent); padding-left:10px; margin:6px 0;
         font-size:13px; color:var(--text); }
  .cue b { color:var(--accent); }
  pre { background:#0b0f14; border:1px solid var(--border); border-radius:6px;
        padding:10px; overflow:auto; font:12px/1.5 var(--mono); max-height:300px; }
  .rev { border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:10px;
         background:var(--panel2); }
  .rev .why { font-size:12px; color:var(--muted); margin:6px 0; }
  input,textarea,select { background:var(--panel); color:var(--text); border:1px solid var(--border);
         border-radius:6px; padding:5px 8px; font-size:12px; }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
           background:var(--panel2); border:1px solid var(--border); padding:8px 16px;
           border-radius:8px; display:none; }
</style>
</head>
<body>
<header>
  <h1>PlayerLab <span>V1.3.3</span></h1>
  <span id="header-sub">Validation Hardening · Human Ground Truth</span>
  <nav>
    <button id="tab-focus" class="on" onclick="goto('focus')">Focus</button>
    <button id="tab-decisions" onclick="goto('decisions')">Decisions</button>
    <button id="tab-matches" onclick="goto('matches')">Matches</button>
    <button id="tab-review" onclick="goto('review')">Review</button>
    <button id="tab-calibration" onclick="goCal()">Calibration</button>
  </nav>
  <button id="lang-btn" onclick="toggleLang()">中 / EN</button>
</header>
<div id="app"></div>
<div id="toast"></div>

let LANG = localStorage.getItem("playerlab_lang") || "zh";
function t(key){ return (I18N[LANG] && I18N[LANG][key]) || I18N.zh[key] || key; }
function toggleLang(){
  LANG = LANG === "zh" ? "en" : "zh";
  localStorage.setItem("playerlab_lang", LANG);
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
  applyLang();
  const h = location.hash;
  if (h.startsWith("#/match/")) {
    const mid = h.slice("#/match/".length);
    renderMatch($("#app"), mid).catch(()=>{});
  } else if (h.startsWith("#/calibration")) {
    renderCalibration($("#app")).catch(()=>{});
  } else if (h) {
    const tgt = h.includes("decisions") ? "decisions" : h.includes("review") ? "review" : h.includes("matches") ? "matches" : "focus";
    goto(tgt);
  } else {
    goto("focus");
  }
}
function applyLang(){
  document.getElementById("header-sub").textContent = t("headerSub");
  document.getElementById("tab-focus").textContent = t("tabFocus");
  document.getElementById("tab-decisions").textContent = t("tabDecisions");
  document.getElementById("tab-matches").textContent = t("tabMatches");
  document.getElementById("tab-review").textContent = t("tabReview");
  document.getElementById("tab-calibration").textContent = t("tabCalibration");
}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = x => x==null ? "—" : (x*100).toFixed(0)+"%";
let RENDER_GEN = 0;                       // 只允许最新一次渲染落盘，防旧渲染覆盖新标签页
function beginRender(){ return ++RENDER_GEN; }
function commitRender(el, g, html){ if (g === RENDER_GEN) el.innerHTML = html; }
function guardActive(g){ return g === RENDER_GEN; }
async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
function toast(m){ const t2=$("#toast"); t2.textContent=m; t2.style.display="block"; setTimeout(()=>t2.style.display="none",2600); }
function setTab(t){ ["focus","decisions","matches","review","calibration"].forEach(x=>$("#tab-"+x).classList.toggle("on", x===t)); }
function goCal(){
  setTab("calibration");
  if (location.hash === "#/calibration"){ renderCalibration($("#app")); }
  else location.hash = "#/calibration";
}

async function goto(page){
  setTab(page);
  const el=$("#app"); el.innerHTML=`<span class="muted">${t("loading")}</span>`;
  try {
    if (page==="focus") return renderFocus(el);
    if (page==="decisions") return renderDecisions(el);
    if (page==="matches") return renderMatches(el);
    return renderReview(el);
  } catch(e){ el.innerHTML=`<span style="color:var(--bad)">${esc(e.message)}</span>`; }
}

/* ---------------- Focus（当前训练焦点） ---------------- */
async function renderFocus(el){
  const g = beginRender();
  const { focus } = await api("/api/focus");
  const { bottlenecks } = await api("/api/bottlenecks");
  const { patterns } = await api("/api/patterns");
  let html = `<h2>${t("currentFocus")}</h2>`;
  const mi = await api("/api/model-intelligence").catch(()=>null);
  if (mi && mi.model_intelligence){
    const m = mi.model_intelligence;
    const stCls = m.status==="CONNECTED"?"ok":"MEDIUM";
    html += `<div class="card"><div class="row">
      <span class="chip ${stCls}">${t("modelIntel")}: ${esc(m.status)}</span>
      <span class="muted">provider=${esc(m.provider)} model=${esc(m.model_version||"—")}</span>
      <span class="muted">tasks: ${(m.loaded_tasks||[]).map(esc).join(", ")||"—"}</span>
    </div>
    <div class="muted mono" style="font-size:11px;margin-top:6px">${esc(m.note||"")}</div></div>`;
  }
  if (!focus.length){
    html += `<div class="card"><span class="muted">${t("noTarget")}</span></div>`;
  }
  for (const ft of focus){
    const cur = ft.progress ?? 0;
    const cue = ft.next_match_cue || {};
    html += `<div class="card">
      <div class="row"><span class="chip">${esc(ft.status)}</span><span class="chip ${esc(ft.category==="Macro Decision"?"MEDIUM":"ok")}">${esc(ft.category)}</span>
        <b>${esc(ft.name)}</b><span class="muted">conf=${ft.confidence}</span></div>
      <div class="row stat" style="margin-top:8px">
        <span>${t("baseline")} <b>${pct(ft.baseline)}</b></span>
        <span>${t("current")} <b>${pct(ft.baseline*(1-cur))}</b></span>
        <span>${t("goal")} <b>${pct(ft.goal)}</b></span>
        <span>${t("progress")} <b>${(cur*100).toFixed(0)}%</b></span>
      </div>
      <div class="bar"><i style="width:${Math.min(100, cur*100)}%"></i></div>
      <div class="cue"><b>${t("when")}</b> ${esc(cue.when||ft.trigger||"")}<br>
        <b>${t("do_")}</b> ${esc(cue.do||ft.replacement_behavior||"")}<br>
        <b>${t("avoid")}</b> ${esc(cue.avoid||ft.undesired_behavior||"")}</div>
      <h3>${t("whyTarget")}</h3>
      <table><tr><th>${t("freq")}</th><th>${t("impact")}</th><th>${t("conf")}</th><th>${t("trainability")}</th><th>${t("level")}</th></tr>
      ${bottlenecks.filter(b=>b.pattern_type===ft.pattern_type).map(b=>`<tr>
        <td>${b.frequency}</td><td>${b.impact}</td><td>${b.confidence}</td>
        <td>${b.trainability}</td><td><span class="chip ${b.level}">${b.level}</span></td></tr>`).join("")||"<tr><td colspan=5 class=muted>—</td></tr>"}
      </table>
      <div class="muted mono" style="font-size:11px;margin-top:6px">
        ${patterns.filter(p=>p.pattern_type===ft.pattern_type).map(p=>
          `pattern: n=${p.sample_count} rate=${p.violation_rate} cf=${p.counterfactual_support}`).join(" · ")}
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn" onclick="feedback('${ft.target_id}','YES')">${t("matchesMe")}</button>
        <button class="btn" onclick="feedback('${ft.target_id}','PARTIALLY')">${t("partially")}</button>
        <button class="btn" onclick="feedback('${ft.target_id}','NO')">NO</button>
      </div>
    </div>`;
  }
  const other = bottlenecks.filter(b=>!b.eligible);
  if (other.length) html += `<div class="card"><h3>${t("belowThreshold")}</h3>` +
    other.map(b=>`<div class="muted mono">${esc(b.pattern_type)}: ${t("belowThresholdReason")}</div>`).join("") + `</div>`;
  commitRender(el, g, html);
}
async function feedback(targetId, label){
  try {
    await api("/api/review/null/annotation", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({annotation_type:"target_feedback", human_label:label, reason_code:"OTHER",
        match_id:"", round:0, tick:0, event_id:"", dp_id:targetId})});
    toast(t("feedbackSaved"));
  } catch(e){ toast(e.message); }
}

/* ---------------- Matches（比赛库） ---------------- */
async function renderMatches(el){
  const g = beginRender();
  const { matches } = await api("/api/matches");
  let html = `<h2>${t("demoLib")}</h2><div class="card">` +
    (matches.length ? `<table><tr><th>${t("match")}</th><th>${t("map")}</th><th>${t("rounds")}</th><th>${t("parsedAt")}</th></tr>` +
      matches.map(m=>`<tr class="click" onclick="location.hash='#/match/${m.demo_id}'">
        <td class="mono">${esc(m.demo_id.slice(0,12))}…</td><td>${esc(m.map_name)}</td>
        <td>${m.rounds_total}</td><td class="muted">${esc(m.parsed_at)}</td></tr>`).join("") + `</table>`
      : `<span class="muted">${t("noDemos")}</span>`) + `</div>`;
  commitRender(el, g, html);
}

/* ---------------- 比赛入口：选择 Focus Player ---------------- */
async function renderMatch(el, matchId){
  const g = beginRender();
  const m = await api("/api/matches/"+matchId);
  const match = m.match;
  let html = `<h2>${esc(match.map_name)} <span class="muted">${match.rounds_total} ${t("rounds")}</span></h2>`;
  const f = await api("/api/focus-player?match="+matchId).catch(()=>({focus:null}));
  const currentFocus = f.focus && f.focus.steam_id ? f.focus.steam_id : null;
  html += `<div class="card">
    <div class="row"><b>${t("focusPlayer")}</b>
      <select id="focus-sel" onchange="selectFocus('${matchId}')">
        <option value="">${t("selectPlayer")}</option>
        ${m.players.map(p=>`<option value="${p.steam_id}" ${p.steam_id===currentFocus?"selected":""}>
          ${esc(p.display_name)} ${p.is_user?"★":""} <span class="muted">(${t("team")} ${p.team})</span></option>`).join("")}
      </select>
      <button class="btn" onclick="rememberFocus('${matchId}')">${t("thisIsMe")}</button>
    </div>
    <div class="muted mono" style="font-size:11px;margin-top:4px">${t("rememberedNote")}</div>
  </div>`;
  if (currentFocus){
    commitRender(el, g, html + `<div id="player-view"></div>`);
    return renderPlayerView(el, matchId, currentFocus);
  }
  commitRender(el, g, html);
}
async function selectFocus(matchId){
  const sid = $("#focus-sel").value;
  if (!sid) return;
  await api("/api/focus-player", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({match_id:matchId, steam_id:sid, remember:false})});
  location.hash = "#/match/"+matchId;
}
async function rememberFocus(matchId){
  const sid = $("#focus-sel").value;
  if (!sid) return toast(t("selectPlayerFirst"));
  await api("/api/remember-player", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({match_id:matchId, steam_id:sid, remember:true})});
  toast(t("rememberedOk"));
  location.hash = "#/match/"+matchId;
}

/* ---------------- Player Overview + Top Review Moments ---------------- */
async function renderPlayerView(el, matchId, steamId){
  const g = beginRender();
  const [ov, mom] = await Promise.all([
    api("/api/matches/"+matchId+"/players/"+steamId+"/overview").catch(()=>({overview:null})),
    api("/api/matches/"+matchId+"/players/"+steamId+"/review-moments").catch(()=>({moments:[]}))
  ]);
  const o = ov.overview || {};
  let html = `<div class="card"><div class="row">
      <span class="chip ${o.summary==="MOSTLY REASONABLE"?"ok":o.summary==="NEEDS REVIEW"?"MEDIUM":""}">${esc(o.summary||"—")}</span>
      <span class="muted">${o.episodes||0} ${t("decisionEpisodes")}</span></div>`;
  if (o.strengths && o.strengths.length) html += `<div class="why"><b>${t("strong")}:</b> ${esc(o.strengths[0].family.replace("_"," "))} (${t("goodShare")} ${Math.round((o.strengths[0].good_share||0)*100)}%)</div>`;
  if (o.needs_review && o.needs_review.length) html += `<div class="why"><b>${t("needsReview")}:</b> ${esc(o.needs_review[0].family.replace("_"," "))} (${t("goodShare")} ${Math.round((o.needs_review[0].good_share||0)*100)}%)</div>`;
  html += `<div class="muted mono" style="font-size:10px">${esc((o.explainable||{}).note||"")}</div></div>`;
  html += `<h3>${t("topReviewMoments")}</h3>`;
  const momList = mom.moments || [];
  if (!momList.length) html += `<div class="card"><span class="muted">${t("noMoments")}</span></div>`;
  for (const mm of momList){
    const d = await api("/api/decisions/"+mm.episode_id).catch(()=>({decision:null}));
    const ep = d.decision || {};
    const em = ep.engagement_method || {};
    const me = ep.movement_effect || {};
    const prims = (ep.execution_primitives||[]).join(", ") || "—";
    html += `<div class="card">
      <div class="row">
        <span class="chip ${mm.is_positive?"ok":mm.review_score>=0.6?"MEDIUM":""}">${mm.is_positive?t("goodExample"):esc(mm.primary_reason||"")}</span>
        <span class="mono muted">r${mm.round||ep.round} t${mm.tick||ep.anchor_tick}</span>
        <span class="muted">score ${mm.review_score}</span>
      </div>
      <div class="why"><b>${t("whyYouFought")}</b>: ${esc(ep.strategic_evaluation||"—")}</div>
      ${ep.engagement_evaluation?`<div class="why"><b>${t("howYouFought")}</b>: ${esc(em.method||"—")} · ${esc(ep.engagement_evaluation||"—")}</div>`:""}
      ${ep.execution_evaluation?`<div class="why"><b>${t("howYouExecuted")}</b>: ${esc(ep.execution_evaluation||"—")} · ${t("issues")}: ${esc(prims)}</div>`:""}
      <div class="muted" style="font-size:12px">${t("whySelected")}: ${esc(mm.why_selected||"")}</div>
      <div class="muted mono" style="font-size:10px">${t("evidence")} ${esc(mm.evidence_sufficiency||"—")} · ${t("actionability")} ${esc(mm.actionability||"—")}</div>
      <div class="row" style="margin-top:6px">
        <button class="btn" onclick="reviewCal('${matchId}','${steamId}')">${t("calibrateThis")}</button>
        <button class="btn" onclick="location.hash='#/decisions'">${t("viewAll")}</button>
      </div>
    </div>`;
  }
  commitRender(el, g, html);
}
async function reviewCal(matchId, steamId){
  const { samples } = await api("/api/matches/"+matchId+"/players/"+steamId+"/calibration").catch(()=>({samples:[]}));
  if (!samples.length) return toast(t("noCalSamples"));
  location.hash = "#/calibration";
}

/* ---------------- Review（人工标注） ---------------- */
async function renderReview(el){
  const g = beginRender();
  const { review } = await api("/api/review");
  let html = `<h2>${t("reviewQueue")} <span class="muted">(${t("reviewQueueNote")})</span></h2>`;
  if (!review.length) html += `<div class="card"><span class="muted">${t("noReview")}</span></div>`;
  for (const it of review){
    const isIntent = it.item_type === "intent";
    const isDecision = it.item_type === "decision_episode";
    const intentBtns = isIntent ? `
      <div class="row" style="margin-top:8px">
        <span class="muted" style="font-size:12px">${t("intentCloser")}</span>
        ${["ROTATE","SOFT_ROTATE","REPOSITION","GATHER_INFO","HOLD","OTHER","UNSURE"].map(l=>
          `<button class="btn" onclick="annotateType('${it.id}','intent','${l}')">${l}</button>`).join("")}
      </div>` : "";
    const prefBtns = isIntent && it.candidates && it.candidates.length >= 2 ? `
      <div class="row" style="margin-top:6px">
        <span class="muted" style="font-size:12px">${t("preferCandidate")}</span>
        <button class="btn" onclick="pref('${it.id}','${it.candidates[0]}')">${it.candidates[0]}</button>
        <button class="btn" onclick="pref('${it.id}','${it.candidates[1]}')">${it.candidates[1]}</button>
      </div>` : "";
    const decisionBtns = isDecision ? `
      <div class="row" style="margin-top:8px">
        <span class="muted" style="font-size:12px">${t("decisionWas")}</span>
        <button class="btn" onclick="annotate('${it.id}','CORRECT','')">${t("correct")}</button>
        <button class="btn" onclick="annotate('${it.id}','INCORRECT','')">${t("wrong")}</button>
        <button class="btn" onclick="annotate('${it.id}','UNSURE','')">${t("unsure")}</button>
      </div>
      <div class="row" style="margin-top:6px">
        <span class="muted" style="font-size:12px">${t("candidateCompare")}</span>
        ${(it.candidates||[]).slice(0,3).map(c=>
          `<button class="btn" onclick="decisionPref('${it.event_id}','${c}')">${c}</button>`).join("")}
      </div>` : "";
    html += `<div class="rev">
      <div class="row"><span class="chip">${esc(it.item_type)}</span>
        <span class="mono muted">r${it.round} t${it.tick}</span>
        <span class="mono muted">${esc(it.match_id.slice(0,8))}…</span>
        <span class="muted">priority ${it.priority}</span></div>
      <div class="why">${t("system")}: <b>${esc(it.model_prediction)}</b> · ${t("confidence")} ${it.model_confidence} ·
        ${esc(it.rationale)}</div>
      <div class="row">
        <span class="muted" style="font-size:12px">${t("doesThisLookRight")}</span>
        <button class="btn" onclick="annotate('${it.id}','CORRECT','')">${t("correct")}</button>
        <button class="btn" onclick="annotate('${it.id}','PARTIALLY_CORRECT','')">${t("partially")}</button>
        <button class="btn" onclick="annotate('${it.id}','INCORRECT','')">${t("wrong")}</button>
        <button class="btn" onclick="annotate('${it.id}','UNSURE','')">${t("unsure")}</button>
        <select id="rc-${it.id}" style="max-width:180px">
          ${["OTHER","TEAM_CALL","MISSING_AUDIO","MISSING_VISUAL_CONTEXT","WRONG_TIMING",
             "WRONG_INFORMATION_ASSUMPTION","EXECUTION_NOT_DECISION"].map(c=>`<option>${c}</option>`).join("")}
        </select>
        <input id="cm-${it.id}" placeholder="${t("comment")}" style="max-width:180px">
      </div>${intentBtns}${prefBtns}${decisionBtns}
    </div>`;
  }
  const stats = await api("/api/annotations/stats").catch(()=>({}));
  if (stats.total) html += `<div class="card"><h3>${t("annStats")}</h3><pre>${esc(JSON.stringify(stats,null,1))}</pre></div>`;
  commitRender(el, g, html);
}
async function annotate(reviewId, label){
  try {
    const rc = $("#rc-"+reviewId)?.value || "OTHER";
    const cm = $("#cm-"+reviewId)?.value || "";
    await api("/api/review/"+reviewId+"/annotation", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({annotation_type:"behavior_detection", human_label:label,
                            human_confidence:0.8, reason_code:rc, optional_comment:cm})});
    toast(t("annSaved")); goto("review");
  } catch(e){ toast(e.message); }
}
async function annotateType(reviewId, type, label){
  try {
    await api("/api/review/"+reviewId+"/annotation", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({annotation_type:type, human_label:label,
                            human_confidence:0.7, reason_code:"OTHER"})});
    toast(type+" "+t("annSaved")); goto("review");
  } catch(e){ toast(e.message); }
}
async function pref(reviewId, choice){
  try {
    await api("/api/review/"+reviewId+"/preference", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({human_choice:choice, human_confidence:0.6, reason_code:"OTHER"})});
    toast(t("prefSaved")); goto("review");
  } catch(e){ toast(e.message); }
}
async function decisionPref(episodeId, action){
  try {
    await api("/api/decisions/"+episodeId+"/preference", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({candidate_a:action, human_choice:"A",
                            human_confidence:0.6, reason_code:"OTHER"})});
    toast(t("decisionPrefSaved")); goto("review");
  } catch(e){ toast(e.message); }
}

/* ---------------- Decisions（DecisionEpisode 决策片段） ---------------- */
async function renderDecisions(el){
  const g = beginRender();
  const { decisions } = await api("/api/decisions");
  const { stats } = await api("/api/decision-stats").catch(()=>({stats:{}}));
  let html = `<h2>${t("decisions")} <span class="muted">(DecisionEpisode)</span></h2>`;
  if (stats && stats.total) html += `<div class="card mono muted" style="font-size:11px">
    episodes=${stats.total} · family=${esc(JSON.stringify(stats.family))} ·
    eval=${esc(JSON.stringify(stats.evaluation))} · actionability=${esc(JSON.stringify(stats.actionability))}
  </div>`;
  if (!decisions.length) html += `<div class="card"><span class="muted">${t("noDecisions")}</span></div>`;
  for (const d of decisions){
    const m = d.macro_context || {};
    const why = m.need_for_information && m.advantage_state
      ? `${t("youWere")} <b>${esc(m.advantage_state.replace("_"," "))}</b> · ${t("infoNeed")} <b>${esc(m.need_for_information)}</b> · ${t("riskTolerance")} <b>${esc(m.risk_tolerance||"—")}</b>.`
      : t("contextUnknown");
    const em = d.engagement_method || {};
    const wm = d.weapon_matchup || {};
    const me = d.movement_effect || {};
    const prims = (d.execution_primitives||[]).map(esc).join(", ") || "—";
    const cands = (d.candidates||[]).filter(c=>!["UNAVAILABLE","TEMPORARILY_UNAVAILABLE"].includes(c.feasibility));
    const engLine = (d.engagement_evaluation && em.method)
      ? `<div class="why"><b>${t("howYouFought")}</b>: ${esc(em.method)} · engagement <b>${esc(d.engagement_evaluation)}</b>` +
        (wm.self_weapon_class ? ` · ${esc(wm.self_weapon_class)} vs ${esc(wm.enemy_weapon_class||"unknown")} @ ${esc(wm.range_bucket||"—")}` : "") +
        (d.information_advantage ? ` · ${t("infoAdvantage")} <b>${esc(d.information_advantage)}</b>` : "") + `</div>` : "";
    const execLine = (d.execution_evaluation && d.execution_primitives)
      ? `<div class="why"><b>${t("howYouExecuted")}</b>: <b>${esc(d.execution_evaluation)}</b>` +
        ` · ${t("issues")}: ${prims}` +
        (me.self_accuracy_cost ? ` · ${t("selfAccuracy")} <b>${esc(me.self_accuracy_cost)}</b> · ${t("oppTracking")} <b>${esc(me.estimated_opponent_tracking_difficulty||"—")}</b>` : "") + `</div>` : "";
    html += `<div class="card">
      <div class="row">
        <span class="chip ${d.actionability==="NOT_ACTIONABLE"?"":d.actionability==="HIGHLY_ACTIONABLE"?"ok":"MEDIUM"}">${esc(d.actionability)}</span>
        <span class="chip ${d.decision_evaluation==="POOR"?"MEDIUM":d.decision_evaluation==="GOOD"?"ok":""}">${esc(d.decision_evaluation)}</span>
        <span class="chip">${esc(d.decision_domain||"")}</span>
        <b>${esc((d.family||"").replace("_"," "))}</b>
        <span class="mono muted">r${d.round} t${d.anchor_tick} p${d.player_id}</span>
      </div>
      <div class="why"><b>${t("observed")}</b>: ${esc(d.observed_action)} · ${t("commitment")} ${esc(d.commitment_state)} · ${t("intent")} ${esc(d.intent)} · sufficiency ${esc(d.evidence_sufficiency||"—")}</div>
      <div class="why"><b>${t("whyFight")}</b>: ${why} <span class="muted">(${t("strategic")} ${esc(d.strategic_evaluation||"—")})</span></div>
      ${engLine}${execLine}
      <div class="row" style="margin-top:6px">
        <span class="muted" style="font-size:12px">${t("alternatives")}:</span>
        ${cands.map(c=>`<span class="chip">${esc(c.action)} <span class="muted">${esc(c.feasibility)}</span></span>`).join("")}
      </div>
    </div>`;
  }
  commitRender(el, g, html);
}

window.addEventListener("hashchange", () => {
  const h = location.hash;
  if (h.startsWith("#/match/")) {
    const matchId = h.slice("#/match/".length);
    const el = $("#app"); el.innerHTML = `<span class="muted">${t("loading")}</span>`;
    return renderMatch(el, matchId).catch(e => el.innerHTML = `<span style="color:var(--bad)">${esc(e.message)}</span>`);
  }
  if (h.startsWith("#/calibration")){ setTab("calibration"); return renderCalibration($("#app")); }
  goto(h.includes("decisions") ? "decisions" : h.includes("review") ? "review" : h.includes("matches") ? "matches" : "focus");
});

/* ---------------- Calibration Lab（校准实验室） ---------------- */
let calSession = [];
let calIdx = 0;
async function renderCalibration(el){
  const g = beginRender();
  const data = await api("/api/calibration-session").catch(()=>({session:[], ground_truth:{detectors:{}}}));
  calSession = data.session || [];
  calIdx = 0;
  const stats = data.ground_truth || {detectors:{}};
  const dets = stats.detectors || {};
  let html = `<h2>${t("calLab")} <span class="muted">(${t("calLabNote")})</span></h2>`;
  html += `<div class="card"><table>
    <tr><th>${t("detector")}</th><th>${t("human")}</th><th>${t("confirmed")}</th><th>${t("precision")}</th>
        <th>${t("groundTruth")}</th><th>${t("simulated")}</th><th>${t("pipeline")}</th></tr>`;
  for (const [det, s] of Object.entries(dets)){
    html += `<tr><td>${esc(det)}</td>
      <td>${s.human_reviewed_count??0}</td><td>${s.human_confirmed_count??0}</td>
      <td>${s.human_confirmation_rate==null?"—":(s.human_confirmation_rate*100).toFixed(0)+"%"}</td>
      <td><span class="chip ${s.calibration_state==="CALIBRATED"?"ok":s.calibration_state==="UNRELIABLE"?"MEDIUM":""}">${esc(s.calibration_state||"UNCALIBRATED")}</span></td>
      <td class="muted">${s.simulated_reviewed_count??0}</td>
      <td><span class="chip">${esc(s.pipeline_validation_state||"NOT_TESTED")}</span></td></tr>`;
  }
  if (!Object.keys(dets).length) html += `<tr><td colspan=7 class="muted">${t("noCalSamplesRow")}</td></tr>`;
  html += `</table><div class="muted mono" style="font-size:10px">${esc(stats.ground_truth_note||"")}</div></div>`;
  html += `<h3>${t("reviewSession")} <span class="muted">(${calSession.length} ${t("sessionNote")})</span></h3>`;
  if (!calSession.length) html += `<div class="card"><span class="muted">${t("allReviewed")}</span></div>`;
  else html += `<div id="cal-card"></div><div class="row" style="margin-top:8px">
    <button class="btn" onclick="calNav(-1)">${t("prev")}</button>
    <button class="btn" onclick="calNav(1)">${t("next")}</button>
    <button class="btn" onclick="calSkip()">${t("skip")}</button>
  </div>`;
  commitRender(el, g, html);
  if (guardActive(g) && calSession.length) renderCalCard();
}
async function renderCalCard(){
  const s = calSession[calIdx];
  if (!s) return renderCalibration(document.getElementById("app"));
  const reasons = await api("/api/calibration-review-fp-reasons", {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify({detector: s.detector_type})}
  ).catch(()=>({reasons:["OTHER","INSUFFICIENT_CONTEXT"]}));
  const neg = s.is_negative_control ? `<span class="chip">${t("negativeControl")}</span>` : "";
  const card = document.getElementById("cal-card");
  if (!card) return;
  card.innerHTML = `<div class="card">
    <div class="row"><span class="chip">${esc(s.detector_type)}</span>${neg}
      <span class="mono muted">r${s.round} t${s.tick}</span>
      <span class="muted">conf ${s.predicted_confidence ?? "—"} · evidence ${esc(s.evidence_sufficiency||"—")}</span>
      <span class="muted">${calIdx+1}/${calSession.length}</span></div>
    <div class="why">${t("systemSays")}: <b>${esc(s.predicted_label)}</b> (${esc(s.sample_stratum||"general")})</div>
    <div class="row" style="margin-top:8px">
      <button class="btn" onclick="calReview('${s.id}','YES',1)">Yes (1)</button>
      <button class="btn" onclick="calReview('${s.id}','NO',1)">No (2)</button>
      <button class="btn" onclick="calReview('${s.id}','UNSURE',1)">Unsure (3)</button>
    </div>
    <div class="row" style="margin-top:6px">
      <select id="fpsel-${s.id}" style="max-width:280px">
        ${reasons.reasons.map(r=>`<option>${esc(r)}</option>`).join("")}
      </select>
      <button class="btn" onclick="calReviewFP('${s.id}')">${t("submitNoReason")}</button>
    </div>
  </div>`;
}
function calNav(delta){ calIdx = Math.max(0, Math.min(calSession.length-1, calIdx+delta)); renderCalCard(); }
function calSkip(){ calIdx++; if (calIdx >= calSession.length) calIdx = 0; renderCalCard(); }
async function calReview(sampleId, label, advance){
  try {
    await api("/api/calibration/"+sampleId+"/review", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({human_label:label, human_confidence:0.8})});
    toast(t("humanLabelSaved"));
    if (advance) calNav(1);
  } catch(e){ toast(e.message); }
}
async function calReviewFP(sampleId){
  const reason = $("#fpsel-"+sampleId)?.value || "OTHER";
  try {
    await api("/api/calibration/"+sampleId+"/review", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({human_label:reason, human_confidence:0.8})});
    toast(t("humanLabelReasonSaved")); calNav(1);
  } catch(e){ toast(e.message); }
}
document.addEventListener("keydown", e => {
  if (!location.hash.startsWith("#/calibration")) return;
  if (e.key === "1") { const s = calSession[calIdx]; if (s) calReview(s.id, "YES", 1); }
  if (e.key === "2") { const s = calSession[calIdx]; if (s) calReview(s.id, "NO", 1); }
  if (e.key === "3") { const s = calSession[calIdx]; if (s) calReview(s.id, "UNSURE", 1); }
  if (e.key.toLowerCase() === "s") calSkip();
});

/* ================= 启动 ================= */
applyLang();
goto("focus");
